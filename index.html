<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="./favicon-16x16.png">
    <link rel="stylesheet" href="./style.css">

    


</head>
<body>
    <main>
        <img src="#" alt="pokemon" class="pokemon_image">
        <img src="./pokedex.png" alt="pokedex" class="pokedex">

        <h1 class="pokemon_data">
            <span class="pokemon_number">6</span>-
            <span class="pokemon_name">charizard</span>
        </h1>

        <form class="form">
            <input type="search" class="input_search" placeholder="number or name" required>
        </form>

        <div class="buttons">
            <button class="button btn-prev">Prev</button>
            <button class="button btn-next">Next</button>
        </div>
    </main>

<script src="./script.js"></script>

</body>
</html>
